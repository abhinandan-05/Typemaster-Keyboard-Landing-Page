<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="icon" href="/assets/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typemaster Keyboard</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="grid-main">
      <nav class="grid-content topnav">
        <a href="">
          <img
            src="assets/shared/logo.svg"
            alt="Typemaster Home"
            width="40"
            height="40"
          />
        </a>
        <button class="button blue">Pre-order now</button>
      </nav>
    </header>

    <main>
      <section class="grid-main hero">
        <div class="grid-content">
          <div class="hero-text">
            <h1>Typemaster keyboard</h1>
            <p>
              Improve your productivity and gaming without breaking the bank.
              Upgrade to high quality machanical typing experience.
            </p>

            <div>
              <button class="button orange">Pre-order now</button>

              <p>
                <strong class="caps">
                  Release on 5/27
                </strong>
              </p>
            </div>
          </div>
          <img
            src="/assets/desktop/image-keyboard.jpg"
            alt="mechanical keyboard"
            width="1080"
            height="980"
            class="hero-image"
          />
        </div>

        <div class="gray-block"></div>
      </section>
    </main>

    <footer></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
